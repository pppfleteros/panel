# Verificacion del cierre de JULIO 2026.
# El 10 de agosto (con reintentos el 11 y 12 por si GitHub demora) re-baja julio
# completo de la API, anclado en la fecha de reparto (cierre de camiones), lo
# compara contra lo que ya estaba guardado y escribe verificacion-2026-07.md.
# Actualiza SOLO el historial (no toca el data.js del panel en vivo).
name: Verificar cierre julio

on:
  schedule:
    - cron: "0 12 10 8 *"   # 10-ago 09:00 hora argentina
    - cron: "0 12 11 8 *"   # 11-ago (respaldo si el 10 no disparo)
    - cron: "0 12 12 8 *"   # 12-ago (respaldo)
  workflow_dispatch:        # y a mano cuando se quiera

concurrency:
  group: actualizar-panel   # comparte candado con el robot diario (no se pisan)
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Saltar si ya se verifico (salvo corrida manual)
        id: guard
        shell: powershell
        run: |
          $existe = Test-Path "verificacion-2026-07.md"
          $manual = ("${{ github.event_name }}" -eq "workflow_dispatch")
          if ($existe -and -not $manual) {
            Write-Output "Ya existe verificacion-2026-07.md; salteo."
            "correr=no" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "correr=si" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Poner hora argentina
        if: steps.guard.outputs.correr == 'si'
        shell: powershell
        run: tzutil /s "Argentina Standard Time"

      - name: Re-bajar julio y comparar
        if: steps.guard.outputs.correr == 'si'
        shell: powershell
        env:
          GESCOM_REALM: ${{ secrets.GESCOM_REALM }}
          GESCOM_USUARIO: ${{ secrets.GESCOM_USUARIO }}
          GESCOM_CLAVE: ${{ secrets.GESCOM_CLAVE }}
          CARTON_URL: ${{ secrets.CARTON_URL }}
          FORCE_MES: "2026-07"
        run: .\robot-nube.ps1

      - name: Publicar historial e informe (no toca data.js)
        if: steps.guard.outputs.correr == 'si'
        shell: powershell
        run: |
          git config user.name "robot-ppp"
          git config user.email "robot-ppp@users.noreply.github.com"
          git add historial-meses.json verificacion-2026-07.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Verificacion del cierre de julio 2026"
            git push
            Write-Output "Verificacion publicada"
          } else {
            Write-Output "Sin cambios que publicar"
          }
