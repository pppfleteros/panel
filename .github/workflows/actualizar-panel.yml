# Robot del Panel de Fleteros PPP en la nube.
# Corre de lunes a viernes a la manana y a la tarde, hora argentina.
# Se puede disparar a mano desde Actions -> "Actualizar panel" -> Run workflow.
#
# Por que 3 horarios por turno: las tareas programadas gratuitas de GitHub son
# de baja prioridad y a veces se demoran horas o se saltean cuando sus servidores
# estan congestionados. Ponemos 3 intentos espaciados (7:08/7:38/8:08 y
# 14:08/14:38/15:08) para que casi siempre uno agarre a tiempo. No molesta correr
# de mas: el robot NO vuelve a publicar si los datos ya estan al dia (git diff).
# (Argentina es UTC-3 sin horario de verano -> sumar 3h para el UTC del cron.)
name: Actualizar panel

on:
  schedule:
    - cron: "8 10 * * 1-5"    # 7:08 hora argentina, lun a vie
    - cron: "38 10 * * 1-5"   # 7:38 (respaldo)
    - cron: "8 11 * * 1-5"    # 8:08 (respaldo)
    - cron: "8 17 * * 1-5"    # 14:08 hora argentina, lun a vie
    - cron: "38 17 * * 1-5"   # 14:38 (respaldo)
    - cron: "8 18 * * 1-5"    # 15:08 (respaldo)
  workflow_dispatch:

concurrency:
  group: actualizar-panel
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Poner hora argentina
        shell: powershell
        run: tzutil /s "Argentina Standard Time"

      - name: Correr el robot
        shell: powershell
        env:
          GESCOM_REALM: ${{ secrets.GESCOM_REALM }}
          GESCOM_USUARIO: ${{ secrets.GESCOM_USUARIO }}
          GESCOM_CLAVE: ${{ secrets.GESCOM_CLAVE }}
          CARTON_URL: ${{ secrets.CARTON_URL }}
        run: .\robot-nube.ps1

      - name: Publicar (commit de data.js e historial)
        shell: powershell
        run: |
          git config user.name "robot-ppp"
          git config user.email "robot-ppp@users.noreply.github.com"
          git add data.js historial-meses.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m ("Datos del " + (Get-Date -Format "dd/MM/yyyy HH:mm"))
            git push
            Write-Output "Publicado en GitHub Pages"
          } else {
            Write-Output "Datos sin cambios: no hace falta publicar"
          }
